<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages | MemoryCare Companion</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes msgIn  { from{opacity:0;transform:translateY(8px)}  to{opacity:1;transform:translateY(0)} }

    .messages-wrapper {
      max-width: 720px;
      margin: 32px auto;
      padding: 0 20px 48px;
    }

    .chat-header {
      background: linear-gradient(135deg, var(--teal-700), var(--teal-900));
      border-radius: 20px 20px 0 0;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .chat-avatar {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: white;
      flex-shrink: 0;
    }

    .chat-name { font-weight: 700; color: white; font-size: 16px; }
    .chat-sub  { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 2px; }

    .chat-body {
      background: var(--slate-50);
      border: 1.5px solid var(--slate-200);
      border-top: none;
      min-height: 400px;
      max-height: 480px;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .chat-body::-webkit-scrollbar { width: 4px; }
    .chat-body::-webkit-scrollbar-thumb { background: var(--slate-300); border-radius: 4px; }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 75%;
      animation: msgIn 0.3s ease;
    }

    .msg-row.sent  { align-self: flex-end; align-items: flex-end; }
    .msg-row.recv  { align-self: flex-start; align-items: flex-start; }

    .msg-bubble {
      padding: 11px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }

    .msg-row.sent .msg-bubble {
      background: linear-gradient(135deg, var(--teal-500), var(--teal-700));
      color: white;
      border-radius: 18px 18px 4px 18px;
    }

    .msg-row.recv .msg-bubble {
      background: white;
      color: var(--slate-700);
      border: 1.5px solid var(--slate-200);
      border-radius: 18px 18px 18px 4px;
      box-shadow: var(--shadow-sm);
    }

    .msg-time {
      font-size: 11px;
      color: var(--slate-400);
      margin-top: 4px;
      padding: 0 4px;
    }

    .empty-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--slate-400);
      text-align: center;
    }

    .empty-chat-icon { font-size: 2.5rem; margin-bottom: 10px; }

    .chat-footer {
      background: white;
      border: 1.5px solid var(--slate-200);
      border-top: none;
      border-radius: 0 0 20px 20px;
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .msg-input {
      flex: 1;
      padding: 11px 16px;
      border: 1.5px solid var(--slate-200);
      border-radius: 14px;
      font-size: 14px;
      font-family: var(--font-body);
      color: var(--slate-800);
      resize: none;
      min-height: 44px;
      max-height: 120px;
      outline: none;
      transition: border-color var(--transition);
      overflow-y: auto;
    }

    .msg-input:focus { border-color: var(--teal-400); box-shadow: 0 0 0 3px rgba(46,148,146,0.10); }

    .btn-send {
      background: linear-gradient(135deg, var(--teal-500), var(--teal-700));
      color: white;
      border: none;
      width: 44px; height: 44px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      transition: all var(--transition);
      box-shadow: var(--shadow-teal);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .btn-send:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(46,148,146,0.30); }
    .btn-send:active { transform: scale(0.95); }
    .btn-send:disabled { background: var(--slate-200); box-shadow: none; cursor: not-allowed; }

    .no-caregiver {
      background: white;
      border: 1.5px solid var(--slate-200);
      border-radius: 20px;
      padding: 48px;
      text-align: center;
      color: var(--slate-400);
      box-shadow: var(--shadow-sm);
    }

    .no-caregiver-icon { font-size: 2.5rem; margin-bottom: 12px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="/user/dashboard.html" class="logo">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22"><path d="M12 21C12 21 3 14.5 3 8.5C3 5.42 5.42 3 8.5 3C10.07 3 11.5 3.68 12 4.5C12.5 3.68 13.93 3 15.5 3C18.58 3 21 5.42 21 8.5C21 14.5 12 21 12 21Z" fill="rgba(255,255,255,0.25)" stroke="white" stroke-width="1.5" stroke-linejoin="round"/><polyline points="5,10 7.5,8 9.5,12 11.5,7 13.5,11 15.5,9 18,10" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></span>
        MemoryCare
      </a>
      <div class="nav-links">
        <a href="/user/dashboard.html">Dashboard</a>
        <a href="/user/history.html">History</a>
        <a href="/user/profile.html">My Profile</a>
        <a href="/user/messages.html" class="active">Messages</a>
        <a href="/user/settings.html">Settings</a>
        <a href="#" id="logoutBtn">Logout</a>
      </div>
    </div>
  </nav>

  <div class="messages-wrapper">
    <div id="chatArea"></div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 MemoryCare Companion. All rights reserved.</p>
    <div class="footer-links">
      <a href="/contact.html">Contact Us</a>
      <a href="/about.html">About</a>
      <a href="mailto:support@memorycare.com">support@memorycare.com</a>
    </div>
    <p class="footer-note">Built with care by Rameen &amp; Sarah</p>
  </footer>

  <script src="/js/logout.js"></script>
  <script>
    let caregiverId = null;
    let caregiverInitial = "C";

    function formatTime(ts) {
      const d = new Date(ts);
      const today = new Date();
      const isToday = d.toDateString() === today.toDateString();
      if (isToday) return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " · " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    async function loadConversation() {
      const area = document.getElementById("chatArea");
      try {
        const res = await fetch("/api/messages/patient/conversation");
        const data = await res.json();

        if (!data.success) { if (res.status === 401) window.location.href = "/login.html"; return; }

        if (!data.caregiverId) {
          area.innerHTML = `
            <div class="no-caregiver">
              <div class="no-caregiver-icon">💬</div>
              <p>You don't have an assigned caregiver yet.<br>Contact your admin to get one assigned.</p>
            </div>`;
          return;
        }

        caregiverId = data.caregiverId;
        caregiverInitial = data.caregiverName.charAt(0).toUpperCase();

        area.innerHTML = `
          <div class="chat-header">
            <div class="chat-avatar">${caregiverInitial}</div>
            <div>
              <div class="chat-name">${data.caregiverName}</div>
              <div class="chat-sub">Your assigned caregiver</div>
            </div>
          </div>
          <div class="chat-body" id="chatBody"></div>
          <div class="chat-footer">
            <textarea class="msg-input" id="msgInput" placeholder="Type a message..." rows="1" onkeydown="handleKey(event)"></textarea>
            <button class="btn-send" onclick="sendMessage()" title="Send">➤</button>
          </div>`;

        renderMessages(data.messages);
        scrollToBottom();

        // Auto-resize textarea
        document.getElementById("msgInput").addEventListener("input", function() {
          this.style.height = "auto";
          this.style.height = Math.min(this.scrollHeight, 120) + "px";
        });

      } catch (e) {
        console.error(e);
      }
    }

    function renderMessages(messages) {
      const body = document.getElementById("chatBody");
      if (!body) return;

      if (!messages.length) {
        body.innerHTML = `
          <div class="empty-chat">
            <div class="empty-chat-icon">💬</div>
            <p>No messages yet. Say hello to your caregiver!</p>
          </div>`;
        return;
      }

      body.innerHTML = messages.map(m => {
        const isSent = m.senderRole === "user";
        return `
          <div class="msg-row ${isSent ? "sent" : "recv"}">
            <div class="msg-bubble">${escapeHtml(m.content)}</div>
            <div class="msg-time">${formatTime(m.createdAt)}</div>
          </div>`;
      }).join("");
    }

    function scrollToBottom() {
      const body = document.getElementById("chatBody");
      if (body) body.scrollTop = body.scrollHeight;
    }

    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    async function sendMessage() {
      const input = document.getElementById("msgInput");
      const content = input?.value.trim();
      if (!content) return;

      const btn = document.querySelector(".btn-send");
      btn.disabled = true;

      try {
        const res = await fetch("/api/messages/patient/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content })
        });
        const data = await res.json();
        if (data.success) {
          input.value = "";
          input.style.height = "auto";
          // Add message to UI immediately
          const body = document.getElementById("chatBody");
          const emptyChat = body.querySelector(".empty-chat");
          if (emptyChat) emptyChat.remove();
          const div = document.createElement("div");
          div.className = "msg-row sent";
          div.innerHTML = `<div class="msg-bubble">${escapeHtml(content)}</div><div class="msg-time">${formatTime(data.message.createdAt)}</div>`;
          body.appendChild(div);
          scrollToBottom();
        }
      } catch (e) { console.error(e); }
      finally { btn.disabled = false; }
    }

    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    loadConversation();
    // Poll for new messages every 30 seconds
    setInterval(async () => {
      const body = document.getElementById("chatBody");
      if (!body) return;
      const res = await fetch("/api/messages/patient/conversation");
      const data = await res.json();
      if (data.success) renderMessages(data.messages);
      scrollToBottom();
    }, 30000);
  </script>
</body>
</html>
