<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | MemoryCare Companion</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22"><path d="M12 21C12 21 3 14.5 3 8.5C3 5.42 5.42 3 8.5 3C10.07 3 11.5 3.68 12 4.5C12.5 3.68 13.93 3 15.5 3C18.58 3 21 5.42 21 8.5C21 14.5 12 21 12 21Z" fill="rgba(255,255,255,0.25)" stroke="white" stroke-width="1.5" stroke-linejoin="round"/><polyline points="5,10 7.5,8 9.5,12 11.5,7 13.5,11 15.5,9 18,10" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></span>
        MemoryCare
      </a>

      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/signup.html">Sign Up</a>
      </div>
    </div>
  </nav>

  <main class="auth-container">
    <form class="auth-card" id="loginForm">
      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Login to continue to your dashboard.</p>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required />
        <small class="error-message" id="emailError"></small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
        <small class="error-message" id="passwordError"></small>
      </div>

      <button type="submit" class="btn-primary auth-btn">Login</button>

      <p class="auth-link">
        Forgot your password? <a href="/forgot-password.html">Reset it</a>
      </p>

      <p class="form-message" id="formMessage"></p>
    </form>
  </main>

    <footer class="footer">
    <p>&copy; 2026 MemoryCare Companion. All rights reserved.</p>
    <div class="footer-links">
      <a href="/contact.html">Contact Us</a>
      <a href="/about.html">About</a>
      <a href="mailto:support@memorycare.com">support@memorycare.com</a>
      <a href="https://github.com" target="_blank">GitHub</a>
      <a href="https://linkedin.com" target="_blank">LinkedIn</a>
    </div>
    <p class="footer-note">Built with care by Rameen &amp; Sarah</p>
  </footer>

  <script src="/js/login.js"></script>
</body>
</html>
