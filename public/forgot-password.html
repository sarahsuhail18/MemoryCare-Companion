<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | MemoryCare Companion</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">
        <span class="logo-mark">M</span>
        MemoryCare
      </a>

      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/login.html">Login</a>
      </div>
    </div>
  </nav>

  <main class="auth-container">
    <form class="auth-card" id="forgotPasswordForm">
      <h2>Reset Password</h2>
      <p class="auth-subtitle">
        Enter your email address to generate a secure reset link.
      </p>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required />
      </div>

      <button type="submit" class="btn-primary auth-btn">Send Reset Link</button>

      <p class="auth-link">
        Remembered your password? <a href="/login.html">Login</a>
      </p>

      <p class="form-message" id="formMessage"></p>
    </form>
  </main>

    <footer class="footer">
    <p>&copy; 2026 MemoryCare Companion. All rights reserved.</p>
    <div class="footer-links">
      <a href="/contact.html">Contact Us</a>
      <a href="/about.html">About</a>
      <a href="mailto:support@memorycare.com">support@memorycare.com</a>
      <a href="https://github.com" target="_blank">GitHub</a>
      <a href="https://linkedin.com" target="_blank">LinkedIn</a>
    </div>
    <p class="footer-note">Built with care by Rameen &amp; Sarah</p>
  </footer>

  <script src="/js/forgot-password.js"></script>
</body>
</html>
